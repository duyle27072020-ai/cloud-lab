services:
  backend:
    image: lekhanhduy0396/mern-backend:1.0
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: ${MONGODB_URI}
      PORT: 5000

  frontend:
    image: lekhanhduy0396/mern-frontend:1.0
    container_name: mern-frontend
    ports:
      - "4173:4173"
    depends_on:
      - backend
